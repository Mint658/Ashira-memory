[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashira-memory"
version = "0.0.1"
description = "Relational memory for AI characters and companions. Local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mint" }]
keywords = [
    "memory", "ai", "llm", "companion", "character", "agents",
    "ollama", "local-first", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]
openai = ["openai>=1.30"]

[project.urls]
Homepage = "https://github.com/Mint658/Ashira-memory"
Issues = "https://github.com/Mint658/Ashira-memory/issues"
Repository = "https://github.com/Mint658/Ashira-memory"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["ashira_memory"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["ashira_memory"]
